<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Display</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Using the raw GitHub URL format -->
    <img src="https://github.com/prypyet/prypyet.github.io/blob/bfb724dd435bcb859f6d153fa097fa4722c12cbb/image/image.png" alt="GitHub Repo Image">

</body>
</html>
