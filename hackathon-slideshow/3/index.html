<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milliseconds Timer</title>
    <!-- Import JetBrains Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
        body {
            background-color: #101010;
            color: #cecdc3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 110pt;
        }
        #timer {
            font-variant-numeric: tabular-nums;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>

    <div id="timer">03.00</div>

    <script>
        const durationMs = 3000; // 3 seconds total
        let startTime = Date.now();
        const timerElement = document.getElementById("timer");

        function updateTimer() {
            let elapsed = Date.now() - startTime;
            let remaining = durationMs - elapsed;

            if (remaining <= 0) {
                timerElement.textContent = "00.00";
                clearInterval(timerInterval);
                console.log("Timer finished!");
                // window.location.href = "next-slide.html"; // Next slide action
                return;
            }

            let seconds = Math.floor(remaining / 1000);
            let milliseconds = Math.floor((remaining % 1000) / 10); // Show 2 digits of milliseconds

            // Format as SS.ms with leading zeros
            let formattedSeconds = String(seconds).padStart(2, '0');
            let formattedMs = String(milliseconds).padStart(2, '0');

            timerElement.textContent = `${formattedSeconds}.${formattedMs}`;
        }

        // Update every 30 milliseconds for a smooth, high-precision counter
        let timerInterval = setInterval(updateTimer, 30);
    </script>

</body>
</html>
