<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Presentation Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Reveal.js Core CSS & White Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/white.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
  
<style>
  /* Title Font Styling */
.reveal h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 3.5rem;
      font-style: italic;
      text-transform: uppercase;
      color: #00d2ff;
      background: linear-gradient(180deg, #ffffff 0%, #00b4db 50%, #0083b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(2px 4px 8px rgba(0, 180, 219, 0.6));
      margin-bottom: 20px;
    }

    .reveal {
      background-color: #101010;
    }
  /* Fixed Logo Top-Right */
  .kl-logo {
    position: fixed;
    top: 20px;
    right: 25px;
    z-index: 99;
    max-height: 80px;
    width: auto;
  }

  /* Borderless Timers */
  .iframe-container {
    width: 100%;
    height: 75vh;
    border: none !important;
    outline: none;
    background: transparent;
  }

  /* Full-Height Vertical Poster (Eliminates Vertical Deadspace) */
  .reveal section img.slide-image {
    max-height: 85vh !important;
    max-width: 100% !important;
    height: auto !important;
    width: auto !important;
    object-fit: contain;
    margin: 0 auto;
    display: block;
  }
</style>
</head>
<body>

  <!-- KL University Logo (Fixed upper-right corner) -->
  <img 
    src="/image/LOG999.webp" 
    alt="KL University Logo" 
    class="kl-logo"
  >

  <div class="reveal">
    <div class="slides">

      <!-- SLIDE 1: 30-Second Timer -->
      <section>
        <h1>PYTHONIX 24</h1>
        <iframe src="/3/index.html" class="iframe-container" title="3 Second Timer"></iframe>
      </section>

      <!-- SLIDE 2: Hosted Image -->
      <section>
        <img src="/image/image.png" alt="Hosted Image" class="slide-image">
      </section>

      <!-- SLIDE 3: 24-Hour Timer -->
      <section>
        <!-- Update the src path below if your 24-hr timer file has a specific name -->
        <iframe src="/24/index.html" class="iframe-container" title="24 Hour Timer"></iframe>
      </section>

    </div>
  </div>

  <!-- Reveal.js JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
<script>
  Reveal.initialize({
    controls: true,
    progress: true,
    center: true,
    hash: true,
    width: 1920,
    height: 1080,
    margin: 0.04,
    minScale: 0.2,
    maxScale: 1.0
  });
</script>
